<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | URBAN FRONTIER</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Noto+Serif+JP:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #050505; --text: #f9f9f9; --text-muted: #888888; --gold: #c5a059; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', 'Noto Serif JP', serif; background: var(--bg); color: var(--text); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
nav { position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 5%; z-index: 100; background: rgba(5,5,5,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); }
.logo { font-size: 1.5rem; font-weight: 600; letter-spacing: 0.1em; color: white; text-decoration: none; font-family: 'Inter', sans-serif; }
.nav-links { display: flex; gap: 3rem; }
.nav-links a { color: white; text-decoration: none; font-size: 0.9rem; letter-spacing: 0.05em; transition: color 0.3s; font-family: 'Inter', sans-serif; text-transform: uppercase; }
.nav-links a:hover { color: var(--gold); }
.contact-container { display: flex; min-height: 100vh; padding-top: 80px; }
.contact-image { flex: 1; background: url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?q=80&w=1200&auto=format&fit=crop') center/cover; }
.contact-content { flex: 1; padding: 8rem 8%; display: flex; flex-direction: column; justify-content: center; }
.title { font-size: 3rem; font-weight: 300; margin-bottom: 1rem; }
.subtitle { color: var(--text-muted); font-size: 1.1rem; line-height: 1.8; margin-bottom: 4rem; font-weight: 300; }
.form-group { margin-bottom: 2.5rem; }
.form-group label { display: block; font-family: 'Inter', sans-serif; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold); margin-bottom: 0.5rem; }
.form-group input, .form-group textarea { width: 100%; background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.2); color: white; padding: 1rem 0; font-size: 1rem; font-family: 'Inter', 'Noto Serif JP', serif; outline: none; transition: border-color 0.3s; }
.form-group input:focus, .form-group textarea:focus { border-bottom-color: var(--gold); }
.submit-btn { display: inline-block; padding: 1.2rem 3rem; border: 1px solid var(--gold); color: var(--gold); background: transparent; text-decoration: none; font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 0.1em; transition: all 0.3s; font-size: 0.85rem; cursor: pointer; width: 100%; }
.submit-btn:hover { background: var(--gold); color: #000; }
@media (max-width: 900px) { .nav-links { display: none; } .contact-container { flex-direction: column; } .contact-image { min-height: 40vh; } .contact-content { padding: 4rem 5%; } }
</style>
</head>
<body>
<nav>
    <a href="index.html" class="logo">URBAN FRONTIER</a>
    <div class="nav-links">
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact</a>
    </div>
</nav>
<div class="contact-container">
    <div class="contact-image"></div>
    <div class="contact-content">
        <h1 class="title">Get in Touch</h1>
        <p class="subtitle">プロジェクトに関するお問い合わせ、協業のご提案など、お気軽にご連絡ください。</p>
        <form>
            <div class="form-group">
                <label>Name</label>
                <input type="text" placeholder="貴社名・お名前">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="メールアドレス">
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea rows="4" placeholder="お問い合わせ内容"></textarea>
            </div>
            <button type="button" class="submit-btn">Send Message</button>
        </form>
    </div>
</div>
</body>
</html>
